<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Make Urdu come out in Nastaliq rather than Kufi.

  The problem this solves. fonts-noto-core carries Noto Nastaliq Urdu, Noto
  Naskh Arabic and Noto Kufi Arabic. All three cover the Arabic script, so when
  a document asks for a Pakistani Urdu font the server does not have, fontconfig
  is free to answer with any of them, and it has been answering with Kufi. The
  text is readable but the shapes are wrong: Urdu is written in Nastaliq, the
  sloping style, and Kufi is squared and geometric. To an Urdu reader it looks
  about as wrong as a contract set in a novelty face.

  Two rules, because two different things go wrong.

  1. Anything tagged as Urdu prefers Nastaliq, whatever font was asked for.
  2. The Urdu fonts people in Pakistan actually use, which we cannot ship
     because they are not freely licensed, are mapped onto Nastaliq by name.
     Without this a document asking for Jameel Noori Nastaleeq gets whatever
     fontconfig thinks is closest, which is how Kufi was being chosen.

  Installed to /etc/fonts/conf.d/ by the Dockerfile. 99 puts it last, so it
  wins over the distribution's own rules.
-->
<fontconfig>

  <!-- 1. For text marked as Urdu, put Nastaliq first. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ur</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Nastaliq Urdu</string>
    </edit>
  </match>

  <!-- 2. The Urdu faces documents from Pakistan commonly ask for. None can be
       shipped here, so each is answered with Nastaliq rather than left to a
       guess that lands on Kufi. -->
  <match target="pattern">
    <test name="family" compare="contains" ignore-blanks="true">
      <string>Nastaleeq</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Nastaliq Urdu</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains" ignore-blanks="true">
      <string>Nastaliq</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Nastaliq Urdu</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Urdu Typesetting</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Nastaliq Urdu</string>
    </edit>
  </match>

  <!-- 3. Keep Kufi out of the generic fallback chain for Arabic script. It is
       a display face. Naskh is the right default when Nastaliq does not apply,
       which is the case for Arabic itself. -->
  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

</fontconfig>
